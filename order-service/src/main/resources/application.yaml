server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:order_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      userService:
        # Number of calls stored in the sliding window
        sliding-window-size: 10

        # Circuit breaker starts calculating failure rate
        # after at least 5 calls
        minimum-number-of-calls: 5

        # Circuit opens when failure rate reaches 50%
        failure-rate-threshold: 50

        # Stay OPEN for 10 seconds
        wait-duration-in-open-state: 10s

        # After OPEN -> HALF_OPEN, allow 3 test calls
        permitted-number-of-calls-in-half-open-state: 3

        # Automatically move OPEN -> HALF_OPEN
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always